<?xml version="1.0" encoding="UTF-8"?>
<!-- AdsCutter icon: a film strip with the ad frame cut out and lifted away. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34445e"/>
      <stop offset="1" stop-color="#1a2232"/>
    </linearGradient>
    <linearGradient id="ad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a4d"/>
      <stop offset="1" stop-color="#d9341f"/>
    </linearGradient>
    <!-- One film piece, 36 wide: strip, sprocket holes, picture area. -->
    <g id="piece">
      <rect x="0" y="0" width="36" height="36" rx="3" fill="#e9edf3"/>
      <g fill="#1f2838">
        <rect x="3" y="3" width="5" height="4" rx="1"/>
        <rect x="12" y="3" width="5" height="4" rx="1"/>
        <rect x="21" y="3" width="5" height="4" rx="1"/>
        <rect x="30" y="3" width="4" height="4" rx="1"/>
        <rect x="3" y="29" width="5" height="4" rx="1"/>
        <rect x="12" y="29" width="5" height="4" rx="1"/>
        <rect x="21" y="29" width="5" height="4" rx="1"/>
        <rect x="30" y="29" width="4" height="4" rx="1"/>
      </g>
      <rect x="3" y="10" width="30" height="16" rx="2" fill="#5b8fd6"/>
    </g>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>

  <!-- Kept programme, left and right of the cut. -->
  <use href="#piece" x="12" y="70"/>
  <use href="#piece" x="80" y="70"/>

  <!-- Cut marks where the ad was. -->
  <g stroke="#ff8a70" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4">
    <line x1="53" y1="64" x2="53" y2="112"/>
    <line x1="75" y1="64" x2="75" y2="112"/>
  </g>

  <!-- The ad, lifted out of the strip. -->
  <g transform="rotate(-14 64 38)">
    <rect x="44" y="20" width="40" height="36" rx="3" fill="url(#ad)"/>
    <g fill="#7a1608" opacity="0.55">
      <rect x="47" y="23" width="5" height="4" rx="1"/>
      <rect x="56" y="23" width="5" height="4" rx="1"/>
      <rect x="65" y="23" width="5" height="4" rx="1"/>
      <rect x="74" y="23" width="5" height="4" rx="1"/>
      <rect x="47" y="49" width="5" height="4" rx="1"/>
      <rect x="56" y="49" width="5" height="4" rx="1"/>
      <rect x="65" y="49" width="5" height="4" rx="1"/>
      <rect x="74" y="49" width="5" height="4" rx="1"/>
    </g>
    <!-- "AD" drawn as strokes so the icon does not depend on fonts. -->
    <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 45 L56 31 L62 45 M52.5 40 H59.5"/>
      <path d="M67 31 V45 H70.5 C75.5 45 78 42 78 38 C78 34 75.5 31 70.5 31 Z"/>
    </g>
  </g>
</svg>
